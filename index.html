<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVOTIX | Creative Media Agency</title>
    <meta name="description" content="Devotix is a premier creative media agency crafting high-impact visual identities, digital products, and commercial productions. Make your brand impossible to ignore." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Immediate Theme & Language Initialization Script -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('devotix_theme') || 'dark';
          var lang = localStorage.getItem('devotix_lang') || 'en';
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
          }
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-black text-neutral-900 dark:text-white font-sans antialiased selection:bg-brand-red selection:text-white overflow-x-hidden transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
